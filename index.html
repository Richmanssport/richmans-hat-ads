const SECT=[["mag", "Magazine"], ["out", "The Outlaw Hat"], ["r", "The 'R' Hat"], ["eag", "The Eagle Hat"], ["ud", "Upside Down Golf"], ["tts", "Tee Time Secured"], ["deal", "Bundles and Deals"], ["shot", "Studio Shots"], ["clean", "Clean Product"], ["spec", "Spec Sheets"]];
let fb={love:[],del:[]};try{fb=Object.assign(fb,JSON.parse(localStorage.getItem("rs-fb")||"{}"))}catch(e){}
let hideDel=false;
const saveFb=()=>{try{localStorage.setItem("rs-fb",JSON.stringify(fb))}catch(e){};const b=document.getElementById("send");if(b)b.textContent=`Send to Claude (♥ ${fb.love.length} · ✕ ${fb.del.length})`;};
let st={k:"feed",g:"all"};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function render(){
  document.querySelectorAll("#bar [data-k]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===st.k));
  document.querySelectorAll("#bar [data-g]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===st.g));
  const m=document.getElementById("m");m.className=st.k;
  m.innerHTML=SECT.filter(([g])=>st.g==="all"||st.g===g).map(([g,t])=>{
    const items=DATA.filter(a=>a.g===g&&!(hideDel&&fb.del.includes(a.id)));
    return `<h2>${esc(t)} <small>${items.length} ads</small></h2><div class="grid">${items.map(a=>{const f=`ads/${st.k}/${st.k==="feed"?a.f:a.s}`;
      return `<div class="card ${fb.del.includes(a.id)?"gone":""}"><a class="im" href="${f}" data-full="${f}"><img loading="lazy" src="${f}?v=1793133835" alt="${esc(a.id)}"></a>
      <div class="info"><b>${a.id}</b><p>${esc(a.h)}</p><div class="acts"><a href="${f}" download="${f.split("/").pop()}">Download</a><button data-copy="${a.id}">Copy text</button></div><div class="fb"><button data-love="${a.id}" class="${fb.love.includes(a.id)?"on":""}">♥ Love</button><button data-del="${a.id}" class="${fb.del.includes(a.id)?"on":""}">✕ Delete</button></div></div></div>`}).join("")}</div>`;
  }).join("");
}
document.getElementById("bar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.k)st.k=b.dataset.k;if(b.dataset.g)st.g=b.dataset.g;render();});
document.getElementById("m").addEventListener("click",e=>{
  const lv=e.target.closest("[data-love]"),dl=e.target.closest("[data-del]");
  if(lv||dl){const id=(lv||dl).dataset[lv?"love":"del"],k=lv?"love":"del",o=lv?"del":"love";
    fb[k]=fb[k].includes(id)?fb[k].filter(x=>x!==id):[...fb[k],id];fb[o]=fb[o].filter(x=>x!==id);saveFb();render();return;}
  const c=e.target.closest("[data-copy]");
  if(c){const a=DATA.find(x=>x.id===c.dataset.copy);navigator.clipboard.writeText(`${a.p}\n\nHeadline: ${a.h}\nDescription: ${a.d}\nLink: ${a.link}`).then(()=>{c.textContent="Copied";setTimeout(()=>c.textContent="Copy text",1200)});return;}
  const im=e.target.closest("a.im");if(im){e.preventDefault();const lb=document.getElementById("lb");lb.querySelector("img").src=im.dataset.full;lb.classList.add("on");}
});
document.getElementById("lb").addEventListener("click",e=>e.currentTarget.classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lb").classList.remove("on")});
document.getElementById("hideDel").addEventListener("click",e=>{hideDel=!hideDel;e.target.setAttribute("aria-pressed",hideDel);render();});
document.getElementById("send").addEventListener("click",()=>{
  const line=id=>{const a=DATA.find(x=>x.id===id);return a?`- ${id} | ${a.v} | ${a.hl}`:`- ${id}`};
  const body=`Ad feedback from the library page.\n\nLOVE\n${fb.love.map(line).join("\n")||"- none"}\n\nDELETE\n${fb.del.map(line).join("\n")||"- none"}\n\nNotes:\n`;
  const d=new Date().toISOString().slice(0,10);
  window.open("https://github.com/Richmanssport/richmans-hat-ads/issues/new?labels=feedback&title="+encodeURIComponent("Ad feedback "+d)+"&body="+encodeURIComponent(body),"_blank");
});
saveFb();render();
</script></body></html>
