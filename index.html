    return `<h2>${esc(t)} <small>${items.length} ads</small></h2><div class="grid">${items.map(a=>{const f=`ads/${st.k}/${st.k==="feed"?a.f:a.s}`;
      return `<div class="card ${fb.del.includes(a.id)?"gone":""}"><a class="im" href="${f}" data-full="${f}"><img loading="lazy" src="${f}?v=1793303460" alt="${esc(a.id)}"></a>
      <div class="info"><b>${a.id}</b><p>${esc(a.h)}</p><div class="acts"><a href="${f}" download="${f.split("/").pop()}">Download</a></div><button class="cu" data-url="${esc(a.link)}">Copy URL</button><div class="url">${esc(a.link.replace("https://",""))}</div><div class="fb"><button data-love="${a.id}" class="${fb.love.includes(a.id)?"on":""}">♥ Love</button><button data-del="${a.id}" class="${fb.del.includes(a.id)?"on":""}">✕ Delete</button></div></div></div>`}).join("")}</div>`;
  }).join("");
}
document.getElementById("bar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.k)st.k=b.dataset.k;if(b.dataset.g)st.g=b.dataset.g;render();});
document.getElementById("m").addEventListener("click",e=>{
  const lv=e.target.closest("[data-love]"),dl=e.target.closest("[data-del]");
  if(lv||dl){const id=(lv||dl).dataset[lv?"love":"del"],k=lv?"love":"del",o=lv?"del":"love";
    fb[k]=fb[k].includes(id)?fb[k].filter(x=>x!==id):[...fb[k],id];fb[o]=fb[o].filter(x=>x!==id);saveFb();render();return;}
  const cu=e.target.closest("[data-url]");
  if(cu){const done=()=>{cu.textContent="Copied";cu.classList.add("ok");setTimeout(()=>{cu.textContent="Copy URL";cu.classList.remove("ok")},1200)};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(cu.dataset.url).then(done,()=>{prompt("Copy this URL",cu.dataset.url)});else prompt("Copy this URL",cu.dataset.url);return;}
  const c=e.target.closest("[data-copy]");
  if(c){const a=DATA.find(x=>x.id===c.dataset.copy);navigator.clipboard.writeText(`${a.p}\n\nHeadline: ${a.h}\nDescription: ${a.d}\nLink: ${a.link}`).then(()=>{c.textContent="Copied";setTimeout(()=>c.textContent="Copy text",1200)});return;}
  const im=e.target.closest("a.im");if(im){e.preventDefault();const lb=document.getElementById("lb");lb.querySelector("img").src=im.dataset.full;lb.classList.add("on");}
});
document.getElementById("lb").addEventListener("click",e=>e.currentTarget.classList.remove("on"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lb").classList.remove("on")});
saveFb();render();
</script></body></html>
